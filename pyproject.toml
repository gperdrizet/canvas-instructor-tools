[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvas-tools"
version = "0.0.1"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "A collection of tools for automating Canvas LMS instructor operations."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "canvasapi>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
canvas-tools = "canvas_tools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_tools"]
